name: macOS arm64 CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.5.1"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Record environment
        run: |
          sw_vers
          uname -m
          node -v
          pnpm -v
          echo 'CI is not the macOS 27.0.1 product target; passing here does not prove target-system acceptance.'
          test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - name: Prepare standalone native test runtime
        run: node scripts/prepare-test-runtime.mjs
      - run: pnpm build
      - name: Guard test-file coverage and runtime versions
        run: node scripts/check-test-coverage.mjs
      - name: Run every default test project
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=ci-report.json
      - name: Check package manifest gate
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run packages/host/test/package-manifest.test.ts --maxWorkers=1
      - name: Report all platform skips
        if: ${{ !cancelled() }}
        run: node scripts/ci-skip-report.mjs ci-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vitest-macos-arm64
          path: ci-report.json
          if-no-files-found: error
