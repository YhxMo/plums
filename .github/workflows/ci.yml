name: macOS arm64 CI

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          heap: "true"
      - name: Run unit test group
        env:
          NODE_OPTIONS: --max-old-space-size=${{ steps.setup.outputs.heap }}
        run: node scripts/ci-run-group.mjs unit
      - name: Check package manifest gate
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run packages/host/test/package-manifest.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-unit
          path: reports/
          retention-days: 14
          if-no-files-found: error

  platform:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          heap: "true"
      - name: Run platform test group
        env:
          NODE_OPTIONS: --max-old-space-size=${{ steps.setup.outputs.heap }}
        run: node scripts/ci-run-group.mjs platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-platform
          path: reports/
          retention-days: 14
          if-no-files-found: error

  electron:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          heap: "true"
          electron: "true"
      - name: Run electron test group
        env:
          NODE_OPTIONS: --max-old-space-size=${{ steps.setup.outputs.heap }}
        run: node scripts/ci-run-group.mjs electron
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-electron
          path: reports/
          retention-days: 14
          if-no-files-found: error

  report:
    needs: [unit, platform, electron]
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reports-*
          path: reports/
          merge-multiple: true
      - name: Aggregate all groups and enforce coverage, skips and migrations
        run: node scripts/ci-aggregate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-aggregate
          path: reports/aggregate.json
          retention-days: 14
          if-no-files-found: error

  diagnostics:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
      - name: Record platform profile
        run: node scripts/ci-platform-profile.mjs
      - name: Preserve profile before native member probes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-platform-profile
          path: reports/diagnostics/profile.json
          retention-days: 14
          if-no-files-found: error
      - name: Record sandbox member calibration
        run: |
          pnpm exec vitest run packages/host/test/project-members-variants.test.ts --maxWorkers=1
      - name: Collect sandbox member evidence
        if: always()
        run: cp .build-cache/native-diagnostics/members-variants.json reports/diagnostics/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-diagnostics
          path: reports/diagnostics/
          retention-days: 14
          if-no-files-found: error
