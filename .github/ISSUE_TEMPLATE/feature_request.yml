name: Feature request
description: Describe a user problem and a proposed Plums improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal paths, or private Agent data.
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and permission implications
