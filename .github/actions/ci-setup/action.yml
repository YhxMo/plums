name: Prepare Plums CI
description: Install fixed runtimes, build the workspace and enforce test coverage
inputs:
  electron:
    description: Prepare the verified Electron runtime
    default: "false"
  heap:
    description: Select a test heap limit from runner memory
    default: "false"
outputs:
  heap:
    description: Heap limit in MiB
    value: ${{ steps.memory.outputs.heap }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "26.5.1"
    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
    - name: Record environment
      shell: bash
      run: |
        sw_vers
        uname -m
        node -v
        pnpm -v
        echo 'CI is not the macOS 27.0.1 product target; passing here does not prove target-system acceptance.'
        test "$(uname -m)" = arm64
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Prepare verified Electron outside the tests
      if: inputs.electron == 'true'
      shell: bash
      env:
        ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
      run: node scripts/prepare-electron.mjs
    - name: Prepare standalone native test runtime
      shell: bash
      run: node scripts/prepare-test-runtime.mjs
    - shell: bash
      run: pnpm build
    - name: Guard test-file coverage and runtime versions
      shell: bash
      run: node scripts/check-test-coverage.mjs
    - name: Select heap limit from runner memory
      id: memory
      if: inputs.heap == 'true'
      shell: bash
      run: node scripts/ci-heap-limit.mjs
