[package]
name = "plums"
version = "0.0.4"
edition = "2021"

[lib]
name = "plums_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
native-transport-experiment = ["dep:reqwest", "dep:tokio", "dep:futures-util"]

[dependencies.reqwest]
version = "=0.13.5"
default-features = false
optional = true

[dependencies.tokio]
version = "=1.53.3"
features = ["sync", "time"]
optional = true

[dependencies.futures-util]
version = "=0.3.34"
default-features = false
features = ["std"]
optional = true
