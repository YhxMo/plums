[package]
name = "plums"
version = "0.2.0"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "plums_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.28.0", features = ["v4"] }
url = "=2.5.8"
http = "=1.5.0"
base64 = "=0.22.1"
# SQLite compiled into the app, so every platform uses the same version.
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dependencies.tokio]
version = "=1.53.3"
features = ["sync", "time", "macros"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"
# Called only from Rust for `link.open`; not registered as a WebView plugin.
tauri-plugin-opener = "=2.7.1"
# Remembers only the main window's size; its commands are not granted to the WebView.
tauri-plugin-window-state = "=2.5.0"
# rustls with the operating system verifier; no system proxy, cookies or decompression.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSApplication", "NSAlert", "NSView", "NSControl", "NSTextField", "NSButton", "NSCell"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
