[package]
name = "plums"
version = "0.0.4"
edition = "2021"

[lib]
name = "plums_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.28.0", features = ["v4"] }

[features]
default = []
native-transport-experiment = ["dep:reqwest", "dep:tokio", "dep:futures-util"]

[dependencies.reqwest]
version = "=0.13.5"
default-features = false
optional = true

[dependencies.tokio]
version = "=1.53.3"
features = ["sync", "time"]
optional = true

[dependencies.futures-util]
version = "=0.3.34"
default-features = false
features = ["std"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
