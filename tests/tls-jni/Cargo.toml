[package]
name = "plums-tls-jni-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking"] }
rustls-platform-verifier = "=0.7.1"
serde_json = "=1.0.154"
zeroize = "=1.9.1"
rustls = { version = "=0.23.46", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

