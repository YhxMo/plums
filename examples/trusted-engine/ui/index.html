<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>本机引擎示例</title>
  <style>
    body {
      font: 16px system-ui;
      background: #faf7f9;
      color: #342c32;
      margin: 0;
      padding: 32px;
      line-height: 1.6;
    }
    main {
      max-width: 760px;
      margin: auto;
    }
    button,
    select,
    textarea {
      font: inherit;
    }
    button,
    select {
      padding: 8px 14px;
      margin: 0 8px 12px 0;
    }
    textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      padding: 12px;
      margin: 12px 0;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    button:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #855275;
    }
    #status {
      min-height: 26px;
    }
    @media (max-width: 520px) {
      body {
        padding: 20px;
      }
      button {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
  <main>
    <h1>本机引擎示例</h1>
    <p>
      启动后，引擎以普通本机程序权限运行。关闭界面后仍可在 Agent
      管理页停止或撤销信任。
    </p>
    <button id="start">启动引擎</button><button id="stop">停止引擎</button>
    <p id="status" role="status">正在读取状态…</p>
    <label for="mode">示例批准模式</label
    ><select id="mode">
      <option value="ask">逐次询问（默认）</option>
      <option value="full">完全访问</option>
      <option value="review">自动审查（仅限示例的读取操作）</option>
    </select>
    <label for="actions">任务操作（JSON）</label
    ><textarea id="actions">[{"type":"wait","ms":6000}]</textarea
    ><button id="run">执行任务</button><button id="cancel">取消任务</button>
    <pre id="output" role="log"></pre>
  </main>
  <script type="module" src="main.js"></script>
</html>
