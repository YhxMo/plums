<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>纸上看板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span>FIELD NOTES / 001</span
      ><button id="manager">返回 Agent 管理 ↗</button>
    </header>
    <main>
      <div class="eyebrow">一个由扩展提供的独立工作界面</div>
      <h1>把事情，<br /><em>放到纸上。</em></h1>
      <form>
        <input id="text" placeholder="记下一件要做的事…" required /><button>
          ＋ 添加卡片
        </button>
      </form>
      <p id="status"></p>
      <div class="columns">
        <section>
          <h2>待完成 <small id="todo-count">0</small></h2>
          <div id="todo"></div>
        </section>
        <section>
          <h2>已完成 <small id="done-count">0</small></h2>
          <div id="done"></div>
        </section>
      </div>
    </main>
    <footer>界面、流程、数据格式都来自 ZIP · 写入由宿主逐次确认</footer>
    <script src="main.js"></script>
  </body>
</html>
