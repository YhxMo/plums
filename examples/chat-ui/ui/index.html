<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Plum Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <h1>plum<span>chat</span></h1>
      <button id="manager">↖ Agent 管理</button>
      <div class="hint">你的角色、工具与界面<br />都来自这个组合包。</div>
    </aside>
    <main>
      <header>
        <strong>你的对话空间</strong>
        <label class="tool-mode"
          ><input id="use-tools" type="checkbox" />使用工作目录工具</label
        >
      </header>
      <div id="messages">
        <section class="welcome">
          <div class="orb">✦</div>
          <h2>从一个想法开始。</h2>
          <p>
            配置协议、模型名称、Base URL 和 API Key，<br />即可开始真实对话。
          </p>
        </section>
      </div>
      <form>
        <textarea
          id="text"
          rows="2"
          placeholder="写下你的问题或想完成的事…"
          required
        ></textarea
        ><button id="send">发送 ↗</button>
      </form>
      <p id="status"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
